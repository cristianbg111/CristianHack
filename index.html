    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', monospace;
            background-color: #030712;
            color: #00ff66;
            overflow: hidden;
            margin: 0;
            padding: 0;
            /* Evitar recarga por gestos táctiles tipo pull-to-refresh en WebView / móviles */
            overscroll-behavior-y: none;
            touch-action: pan-x pan-y;
            transition: filter 1s ease, box-shadow 1s ease;
        }

        /* CRT Screen Simulation Overlay */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* CRT Flicker effect */
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }
        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        /* Dynamic Theme Variables / Classes */
        .theme-green { --theme-color: #00ff66; --theme-bg: #030712; }
        .theme-cyan { --theme-color: #00f0ff; --theme-bg: #030a12; }
        .theme-amber { --theme-color: #ffb700; --theme-bg: #120903; }
        .theme-red { --theme-color: #ff003c; --theme-bg: #120305; }
        .theme-purple { --theme-color: #bf00ff; --theme-bg: #0b0312; }

        /* Glow effects */
        .neon-glow {
            text-shadow: 0 0 8px var(--theme-color), 0 0 20px var(--theme-color);
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--theme-color, #00ff66);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }

        /* Matrix Canvas background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.18;
            pointer-events: none;
        }

        .terminal-container {
            position: relative;
            z-index: 10;
            transition: transform 0.5s ease;
        }

        .blink-cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hex Grid Background decoration */
        .hex-grid {
            background-image: radial-gradient(rgba(0, 255, 102, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
        const alphabet = katakana + latin;

        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const rainDrops = [];

        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        let matrixColor = '#00ff66';
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = matrixColor;
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        const themes = [

            { name: 'Blood Red', color: '#ff003c', rgb: '255, 0, 60', class: 'theme-red' },

        window.setTheme = function(themeObj) {

            matrixColor = themeObj.color;

            document.documentElement.style.setProperty('--theme-rgb', themeObj.rgb);
        };

        window.randomColorTheme = function() {
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            window.setTheme(randomTheme);
            return randomTheme;
        };

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            
            document.getElementById('cpu-load').innerText = (Math.floor(Math.random() * 35) + 12) + '%';
            document.getElementById('ping-val').innerText = (Math.floor(Math.random() * 6) + 9) + 'ms';
        }, 1000);

        const terminalOutput = document.getElementById('terminal-output');
        const commandInput = document.getElementById('command-input');
        let commandHistory = [];
        let historyIndex = -1;
        let audioEnabled = true;
        let audioCtx = null;
        let activeHackingInterval = null;
        let activeDangerInterval = null;

        window.toggleAudio = function() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-btn');
            const icon = document.getElementById('audio-icon');
            if (audioEnabled) {
                btn.style.background = 'var(--theme-color)';
                btn.style.color = '#000';
                icon.className = "fa-solid fa-volume-high mr-1";
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                appendOutput("<span class='text-gray-400'>[-] Audio synthesizer disabled.</span>");

        };

        function playBeep(freq = 440, duration = 0.05, type = 'sine', volume = 0.25) {
            if (!audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                // Increased volume for louder audio feedback
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const bootAscii = `

        window.onload = function() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const btn = document.getElementById('audio-btn');
            const icon = document.getElementById('audio-icon');
            btn.style.background = 'var(--theme-color)';
            btn.style.color = '#000';
            icon.className = "fa-solid fa-volume-high mr-1";

            appendOutput(bootAscii);
            playBeep(600, 0.1);
        };

        commandInput.addEventListener('keydown', function(e) {
            playBeep(800 + Math.random()*200, 0.02, 'square', 0.2);
            if (e.key === 'Enter') {
                const cmd = commandInput.value.trim();
                if (cmd !== '') {
                    commandHistory.push(cmd);
                    historyIndex = commandHistory.length;
                    appendOutput(`<span class="text-gray-500">root@cristian-hack:~$</span> <span class="text-white font-bold">${escapeHtml(cmd)}</span>`);
                    window.runCommand(cmd);
                    commandInput.value = '';
                }
            } else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    commandInput.value = commandHistory[historyIndex];
                }
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                if (historyIndex < commandHistory.length - 1) {

                    commandInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    commandInput.value = '';
                }
                e.preventDefault();
            }
        });

        window.submitCommand = function() {
            const cmd = commandInput.value.trim();
            if (cmd !== '') {
                commandHistory.push(cmd);
                historyIndex = commandHistory.length;
                appendOutput(`<span class="text-gray-500">root@cristian-hack:~$</span> <span class="text-white font-bold">${escapeHtml(cmd)}</span>`);
                window.runCommand(cmd);
                commandInput.value = '';
            }
            commandInput.focus();
        };

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.clearTerminal = function() {
            terminalOutput.innerHTML = '';
            playBeep(300, 0.1);

        window.maximizeWindow = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    appendOutput(`<span class="text-red-400">[-] Error entering fullscreen: ${err.message}</span>`);

            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }

        };

            const term = document.getElementById('terminal-output');
            if (direction === 'up') {
                term.scrollTop -= 120;

                term.scrollTop += 120;
            }
        };

            const cmd = parts[0];
            const arg = parts[1];

            playBeep(520, 0.05);

            switch(cmd) {
                case 'help':
                    appendOutput(`

            appendOutput(`
                <div class="my-2">
                    <div class="text-yellow-400 text-xs mb-1">${title}</div>
                    <div class="w-full bg-gray-900 border rounded h-3 overflow-hidden" style="border-color: rgba(var(--theme-rgb, 0,255,102), 0.3);">
                        <div id="${id}" class="h-full w-0 transition-all duration-300" style="background-color: var(--theme-color);"></div>
                    </div>
                </div>
            `);

            let progress = 0;
            const bar = document.getElementById(id);
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 20) + 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    steps.forEach(step => appendOutput(`<div class="text-xs">${step}</div>`));
                }
                if (bar) bar.style.width = progress + '%';
            }, 150);
        }
    </script>
</body>
</html>
